[project]
name = "karkas"
version = "0.1.0"
description = "ИИ-агент методиста АЦР: образовательная программа и комплект материалов по шаблону"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
markers = ["llm: реальный вызов GigaChat, тратит дневной бюджет (по умолчанию не запускать)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 110
target-version = "py310"
cache-dir = ".cache/ruff"
extend-exclude = [".venv", ".cache", ".tmp", "data/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
