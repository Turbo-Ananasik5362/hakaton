# Gitea Actions (синтаксис GitHub Actions). Если в репозитории есть .gitea/workflows, Gitea берёт только их,
# поэтому .github/workflows/tests.yml здесь не запускается второй раз.
# Полная проверка на каждый push в main и на каждый pull request: ruff, pytest, смоук API.
# Модель не вызывается (LLM_MODE=mock), секреты не нужны. Та же команда локально: bash scripts/check.sh
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_MODE: mock
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Зависимости
        run: python -m pip install -r requirements.txt
      - name: Проверка (ruff, pytest, смоук)
        run: bash scripts/check.sh
      - name: Отчёт о тестах
        if: always()
        run: cat docs/test_report.md
